# dbt + DuckDB layer over the app's tables (pilot, 2026-11-12). Run it with
#   python -m tools.warehouse
# which builds every model and runs every test in one in-memory DuckDB session (no database file
# in the synced Drive folder). How and why: tools/warehouse.py and README.md ("The dbt layer").
name: fap_warehouse
version: "1.0.0"
config-version: 2
profile: fap_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

vars:
  # A season shorter than this is too small a sample for a per-90 rate (10 full matches).
  min_minutes: 900

models:
  fap_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
