version: 2

models:
  - name: stg_shots
    description: One row per Premier League 2015/16 shot with its out-of-fold xG.
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: player
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: goal
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: xg
        data_tests: [not_null, probability]
      - name: statsbomb_xg
        description: StatsBomb's own xG, kept for comparison; the app never shows it.
        data_tests: [probability]

  - name: player_xg
    description: >
      One row per player and club: shots, goals, xG and goals − xG, plus the non-penalty split.
      Reproduces app_data/player_xg_table.parquet exactly (tests/assert_player_xg_matches_pandas.sql).
    data_tests:
      - unique_together:
          arguments:
            columns: [player, team]
    columns:
      - name: shots
        data_tests: [not_null]
      - name: xg_per_shot
        data_tests: [probability]

  - name: team_xg
    description: One row per club, the sum of its shooters.
    columns:
      - name: team
        data_tests: [unique, not_null]

  - name: stg_events
    description: One row per match event from the raw layer, renamed and typed. Local only (needs the landed Parquet).
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests: [not_null]
      - name: event_index
        data_tests: [not_null]
      - name: event_type
        data_tests: [not_null]

  - name: int_shot_features
    description: >
      One row per in-game shot with the xG model's features, built in SQL from the raw events.
      Equals what pandas builds (tests/assert_shot_features_match_pandas.sql).
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: is_goal
        data_tests: [not_null]
      - name: game_state_score_diff
        data_tests: [not_null]
      - name: assist_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["None", "Cross", "Through Ball", "Cut Back", "Standard Pass"]
      - name: shot_statsbomb_xg
        data_tests: [probability]
