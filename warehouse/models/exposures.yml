version: 2

# Who uses the warehouse's output, so the docs site's graph ends in the product, not in a table.
# Since 2026-11-15 the app's StatsBomb player table is built from the two per-90 marts
# (src/warehouse_tables.py → src/app_data.py, which adds league normalisation and clusters in
# Python, then app_data/player_per90.parquet). The xG tables still come from the Python pipeline
# (the app_data sources below): the SQL shot features are parity-checked on the Premier League
# only, not yet on Leverkusen 2023/24, the model's other training season.
exposures:
  - name: streamlit_app
    label: Player Evaluation Framework (live app)
    type: application
    maturity: high
    url: https://gpfootball-analytics-portfolio.streamlit.app
    description: >
      The public Streamlit app: a player's style, whether the goals are real (goals against xG,
      and the range luck alone gives), and who plays like him, next to a market value. Its
      StatsBomb player table is built from the per-90 marts; it reads app_data/ through
      views/data.py and never queries the warehouse directly.
    owner:
      name: Guilherme Padinha
    depends_on:
      - ref('player_per90_outfield')
      - ref('player_per90_goalkeepers')
      - source('app_data', 'shots_with_xg')
      - source('app_data', 'player_xg_table')
