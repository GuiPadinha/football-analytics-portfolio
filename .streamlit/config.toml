# Streamlit theme: the redesign's palette (2026-10-10), from the approved mockup. A near-black blue
# base, a slightly lighter panel colour, and orange as the one accent. Orange marks "above"
# (strengths, goals), blue marks "below" (weaknesses, misses); views/components.py's CSS and the
# shot map use the same hexes, so the chrome and the content read as one product.
#
# No [server] section here on purpose: `headless` is a deployment-time concern (Streamlit
# Cloud sets it itself), not something to hardcode in a config every local dev also inherits —
# `headless = true` here was exactly what silently stopped `streamlit run app.py` from
# auto-opening a browser tab locally (found 2026-07-04).
[theme]
base = "dark"
primaryColor = "#F28C38"
backgroundColor = "#0F1419"
secondaryBackgroundColor = "#182028"
textColor = "#E8ECEF"
font = "sans serif"
